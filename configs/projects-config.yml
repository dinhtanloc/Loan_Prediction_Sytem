frontend:
  api_gateway_url: "https://your-domain.com"
  using_prod_api: true
  enable_mock_data: false
  build_mode: "production"

backend:
  service:
    name: "backend-api"
    version: "1.0.0"
    host: "0.0.0.0"
    port: 8000
    base_url: "/api/v1"

  database:
    mongodb_enabled: true
    mongodb_name: "appdb"

  monitoring:
    tracing_enabled: false

  logging:
    level: "INFO"
    json_format: false




ml:
  service:
    name: "ml-prediction-service"
    version: "1.0.0"
    host: "0.0.0.0"
    port: 5001
    base_url: "/ml/api/v1"

  model:
    path: "model_ml.joblib"

  memory:
    directory: "cache/"

  monitoring:
    jaeger_host: "jaeger.monitoring.svc.cluster.local"
    jaeger_port: 6831
    tracing_enabled: true

  prometheus:
    enabled: true
    metrics_path: "/metrics"

  logging:
    level: "INFO"
    json_format: true


